<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velnavi - Log In</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/login.css">
    <link rel="shortcut icon" href="../assets/logo.jpg" type="image/x-icon">
</head>

<body>
    <!--  ****************************************cursor dot *********************************************** -->
    <!-- <div class="cursor-dot"></div>
    <div class="cursor-ring"></div> -->


    <!--  ****************************************cursor dot end *********************************************** -->


    <a href="../index.html" class="back-btn">
        <span class="back-arrow">&#8592;</span> Back
    </a>

    <a href="signup.html" class="next-btn">
        Sign-Up<span class="next-arrow">&#8594;</span>
    </a>
 

    <div class="auth-page">

        <!-- Decorative background blobs -->
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>

        <div class="auth-card">

            <!-- LEFT SIDE: Form -->
            <div class="auth-left">

                <div class="auth-logo">
                    <img src="../assets/logo.jpg" alt="Velnavi Logo" class="logo-img">
                    <span class="logo-text">Velnavi</span>
                </div>

                <div class="auth-badge">WELCOME BACK</div>
                <h1 class="auth-heading">Log in to your account<span class="dot">.</span></h1>
                <p class="auth-subtext">Continue your English practice journey with Velnavi.</p>

                <form class="auth-form" id="loginForm">

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>

                    <div class="form-extra">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe">
                            Remember me
                        </label>
                        <a href="#" class="auth-link">Forgot password?</a>
                    </div>

                    <div class="form-buttons">
                        <a href="signup.html" class="btn btn-secondary">Create Account</a>
                        <button type="submit" class="btn btn-primary">Log In</button>
                    </div>

                </form>

                <p class="auth-footer-text">
                    Don't have an account? <a href="signup.html" class="auth-link">Sign up</a>
                </p>

            </div>
            <!-- LEFT SIDE END -->

            <!-- RIGHT SIDE: Image -->
            <div class="auth-right">
                <img src="../assets/people-talking-concept-illustration_114360-7082.avif"
                    alt="People practicing English together" class="auth-image">
                <div class="auth-image-overlay"></div>
                <div class="auth-quote">
                    "Real People. Real Conversations. Real Growth."
                </div>
            </div>
            <!-- RIGHT SIDE END -->

        </div>

    </div>

    <script src="../homepage.js/login.js"></script>
</body>

</html>
